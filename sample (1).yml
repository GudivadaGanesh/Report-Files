# This is a basic workflow to help you get started with Actions
name: 'On Changes to Github-actions'

# Controls when the workflow will run
on:
  push:
    branches:
      - 'main'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: Run Testsigma Automation Suites
        run: |
          cd ${{ github.workspace }}/testsigma
          chmod a+x tesarun_smoke_tests.sh
          ./tesarun_smoke_tests.sh

      - name: Upload Testsigma Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testsigma-reports
          path: |
            ${{ github.workspace }}/testsigma/junit-report.xml
            ${{ github.workspace }}/testsigma/testsigma.json
            ${{ github.workspace }}/testsigma/testsigma-report.html